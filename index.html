<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Github Account Checker</title>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <div class="top">
        <i class="ri-github-fill"></i>
        <div class="heading">
          <h1>Github Account Checker</h1>
          <h6>
            GitHub Account Checker helps you quickly find out if a GitHub username exists. Enter any username to instantly verify whether the associated account is active, available, or does not exist at all.
          </h6>
        </div>
      </div>
      <form>
        <input type="text" id="inp" placeholder="🔍  Enter your github username" />
        <input type="submit" value="Get Profile" id="btn1" />
      </form>
      <div class="account">
        <!-- <h1>Give ID to find!</h1>  -->
        
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
